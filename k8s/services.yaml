apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: workflow-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      containers:
      - name: workflow-service
        image: your-registry/workflow-service:latest
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: service-secrets
              key: MONGODB_URI
        - name: EXECUTION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: EXECUTION_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: workflow-system
spec:
  selector:
    app: workflow-service
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: workflow-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
      - name: execution-service
        image: your-registry/execution-service:latest
        ports:
        - containerPort: 50051
        env:
        - name: GRPC_PORT
          value: "50051"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: REDIS_HOST
        - name: AI_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: AI_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: workflow-system
spec:
  selector:
    app: execution-service
  ports:
  - port: 50051
    targetPort: 50051
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-worker
  namespace: workflow-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: execution-worker
  template:
    metadata:
      labels:
        app: execution-worker
    spec:
      containers:
      - name: execution-worker
        image: your-registry/execution-service:latest
        command: ["node", "dist/worker/workflow-worker.js"]
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: REDIS_HOST
        - name: AI_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: AI_SERVICE_URL
---
apiVersion: apps/v1
