apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
  namespace: workflow-system
data:
  JWT_EXPIRES_IN: "1h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  NODE_ENV: "production"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MONGODB_AUTH_DB: "auth-db"
  MONGODB_WORKFLOW_DB: "workflow-db"
  EXECUTION_SERVICE_URL: "execution-service:50051"
  AI_SERVICE_URL: "ai-service:50052"
